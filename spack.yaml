# Reproducible spack environment for this repo, named "retrieval-experiments"
# (see README.md's "Dependencies" section for the full explanation and
# manual-setup alternative). Create/activate it with:
#
#   spack env create retrieval-experiments spack.yaml
#   spack env activate retrieval-experiments
#   spack install
#
# `run_with_spack.sh` activates this env by name before running the
# Python pipeline.
#
# Deliberately NOT installing Rust via spack: spack's `rust` package lags
# upstream (latest concrete release is 1.81.0 as of this writing), and
# this repo's `Cargo.toml` needs edition 2024, which requires rustc 1.85+
# - an env built with spack's `rust` spec can't compile it. Install Rust
# via rustup instead (https://rustup.rs) and let it sit on PATH ahead of
# this spack env; see README.md's "Dependencies" section.
spack:
  specs:
    - cmake
    - gmake
    - git
    - python@3.11
    - py-pandas
  concretizer:
    unify: true
  view: true
