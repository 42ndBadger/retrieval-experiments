# Example config for `python -m experiments.run experiments/example_config.toml`.
# Run from the repository root.

[experiment]
n = 100000
construction_repetitions = 20
query_repetitions = 1000
data_dir = "data"
results_dir = "results"
plot_dir = "plots"

[[algorithm]]
name = "consensus"
[algorithm.params]
avg_group_load = 25
inital_group_width = 20
insertion_increment = 8
max_difficulty_of_task = 15.0
max_difficulty_at_group_border = 12.0

[[algorithm]]
name = "caramel"

[[algorithm]]
name = "lsf"

[[distribution]]
type = "uniform"
bound = [3, 17]

[[distribution]]
type = "bernoulli"
p = [0.2,  0.3,  0.5]

[[distribution]]
type = "truncated_geometric"
p = [0.2]
bound = [10, 20]
