# Example config for `python -m experiments.run experiments/paper_config.toml`.
# Run from the repository root.

[experiment]
n = 10_000_000
construction_repetitions = 1
query_repetitions = 1_000
data_dir = "paper/data"
results_dir = "paper/results"
plot_dir = "paper/plots"

[[algorithm]]
name = "consensus"
[algorithm.params]
avg_group_load = 35
inital_group_width = 30
insertion_increment = 4
max_difficulty_of_task = 8
max_difficulty_at_group_border = 6

[[algorithm]]
name = "consensus"
[algorithm.params]
avg_group_load = 35
inital_group_width = 30
insertion_increment = 8
max_difficulty_of_task = 16
max_difficulty_at_group_border = 12.0

[[algorithm]]
name = "consensus"
[algorithm.params]
avg_group_load = 60
inital_group_width = 50
insertion_increment = 12
max_difficulty_of_task = 24
max_difficulty_at_group_border = 18

[[algorithm]]
name = "caramel"

[[distribution]]
type = "uniform"
bound = [3, 17, 23]

[[distribution]]
type = "bernoulli"
p = [0.1,  0.25,  0.5]

[[distribution]]
type = "truncated_geometric"
p = [0.2]
bound = [10]
