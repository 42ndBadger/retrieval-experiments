[[algorithm]]
name = "caramel"

[[distribution]]
type = "uniform"
bound = [3, 23]

[[distribution]]
type = "bernoulli"
p = [0.1,  0.25,  0.5]

[[distribution]]
type = "truncated_geometric"
p = [0.2]
bound = [10]
