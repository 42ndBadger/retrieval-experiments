# Example config for `python -m experiments.run experiments/small_config.toml`.
# Run from the repository root.

[experiment]
n = 100_000
construction_repetitions = 1
query_repetitions = 1_000
data_dir = "runs/small/data"
results_dir = "runs/small/results"
plot_dir = "runs/small/plots"

[[algorithm]]
name = "consensus"
display_name = "Consensus A"
[algorithm.params]
avg_group_load = 35
inital_group_width = 30
insertion_increment = 4
max_difficulty_of_task = 8
max_difficulty_at_group_border = 6

[[algorithm]]
name = "consensus"
display_name = "Consensus B"
[algorithm.params]
avg_group_load = 35
inital_group_width = 30
insertion_increment = 8
max_difficulty_of_task = 16
max_difficulty_at_group_border = 12.0

